name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Integrity checks, before anything expensive runs ---
      #
      # A release is three things that must agree: the tag, the version the build
      # stamps into the jar, and the written notes. Nothing previously checked that
      # they did, so a tag pushed against a stale build.sbt would publish a jar named
      # for the wrong version, and a missing notes file would publish a release with
      # only an auto-generated commit list. Both fail here instead, in seconds.

      - name: Tag must match the build version
        run: |
          BUILD_VERSION=$(grep -oE 'ThisBuild / version := "[^"]+"' build.sbt | sed 's/.*"\(.*\)"/\1/')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "build.sbt: $BUILD_VERSION"
          echo "tag:       $TAG_VERSION"
          if [ "$BUILD_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match build.sbt version ${BUILD_VERSION}"
            exit 1
          fi

      - name: Release notes must exist
        run: |
          NOTES="draco-git-record/release-notes-${GITHUB_REF_NAME}.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::Missing ${NOTES} — write the notes before tagging"
            exit 1
          fi
          echo "notes: $NOTES ($(wc -l < "$NOTES") lines)"

      # --- Build ---

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: sbt

      # The official sbt action. This replaces a hand-rolled apt install that added
      # the scala-sbt debian repo with `apt-key add` — deprecated, and removed on
      # current runner images — and depended on a keyserver lookup at build time.
      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Run tests
        run: sbt test

      - name: Build fat JAR
        run: sbt assembly

      # --- Publish ---

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/scala-2.13/draco-*.jar
          # Fail rather than publish a release with no artifact attached.
          fail_on_unmatched_files: true
          # The written notes become the release body; GitHub's generated commit list
          # is appended below them. Previously the body was the commit list alone and
          # the real notes had to be attached by hand afterwards.
          body_path: draco-git-record/release-notes-${{ github.ref_name }}.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
